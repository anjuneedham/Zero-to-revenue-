<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7ad7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wow! Wubb Adventure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#1b2340;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;font-family:"Trebuchet MS",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#7ad7ff;image-rendering:auto;max-width:100vw;max-height:100vh}
  #touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  .btn{width:76px;height:76px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.28);
    color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;
    text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .btn.on{background:rgba(255,255,255,.6)}
  body.touch #touch{display:flex}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="448"></canvas></div>
<div id="touch">
  <div class="grp"><div class="btn" id="bl">◀</div><div class="btn" id="br">▶</div></div>
  <div class="grp"><div class="btn" id="bj">⬆</div></div>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>
