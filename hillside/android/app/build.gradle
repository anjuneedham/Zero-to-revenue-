plugins { id 'com.android.application' }

android {
    namespace 'app.hillside.daily'
    compileSdk 34
    defaultConfig {
        applicationId 'app.hillside.daily'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            // Provide via environment so no secrets live in the repo.
            def ks = System.getenv('HS_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('HS_STORE_PASSWORD')
                keyAlias System.getenv('HS_KEY_ALIAS') ?: 'hillside'
                keyPassword System.getenv('HS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
