name: Build Wubb APK
on:
  workflow_dispatch:
  push:
    paths: ["games/wubb/**", ".github/workflows/wubb-apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/wubb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Force landscape
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - run: ./gradlew assembleDebug
        working-directory: games/wubb/android
      - uses: actions/upload-artifact@v4
        with:
          name: wubb-debug-apk
          path: games/wubb/android/app/build/outputs/apk/debug/app-debug.apk
